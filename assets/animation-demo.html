<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f17; color: #c0caf5; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; min-height: 100vh; }
  h1 { font-size: 1.2rem; margin-bottom: 4px; }
  .subtitle { font-size: 0.8rem; color: #565f89; margin-bottom: 16px; }

  /* Controls */
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; font-size: 0.78rem; }
  .controls label { display: flex; align-items: center; gap: 6px; color: #7a7f9a; }
  .controls select, .controls input[type="range"] { background: #1a1b26; border: 1px solid #333; color: #c0caf5; border-radius: 4px; padding: 3px 6px; font-size: 0.75rem; }
  .controls input[type="range"] { width: 80px; accent-color: #7aa2f7; }
  .controls button { background: #7aa2f7; color: #1a1b26; border: none; border-radius: 4px; padding: 5px 14px; font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: opacity 0.15s; }
  .controls button:hover { opacity: 0.85; }
  .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
  .controls button.secondary { background: #292e42; color: #c0caf5; }
  .speed-val { font-family: 'Courier New', monospace; min-width: 1.2em; text-align: center; color: #c0caf5; }

  /* Terminal */
  .term-wrap { background: #1a1b26; border: 1px solid #333; border-radius: 8px; overflow: hidden; width: 100%; max-width: 720px; }
  .term-bar { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: #15161e; border-bottom: 1px solid #333; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-r { background: #ff5f57; } .dot-y { background: #febc2e; } .dot-g { background: #28c840; }
  .term-title { color: #565f89; font-family: monospace; font-size: 10px; margin-left: 6px; }
  #terminal { font-family: 'Courier New', 'Consolas', 'Liberation Mono', monospace; font-size: 11px; line-height: 1.35; padding: 12px; white-space: pre; overflow-x: auto; min-height: 340px; color: #c0caf5; }

  .cursor-blink { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .note { font-size: 0.7rem; color: #565f89; font-style: italic; margin-top: 10px; max-width: 720px; text-align: center; }
</style>
</head>
<body>

<h1>🎨 termux-fastfetch-rotator — Animation Demo</h1>
<p class="subtitle">Vista previa de la animación de construcción de logos en <code>rotate.sh</code></p>

<div class="controls">
  <label>
    Estilo
    <select id="styleSelect">
      <option value="line" selected>Línea por línea</option>
      <option value="char">Carácter por carácter</option>
    </select>
  </label>
  <label>
    Velocidad
    <input id="speedSlider" type="range" min="1" max="10" value="5" />
    <span id="speedLabel" class="speed-val">5</span>
  </label>
  <label>
    Distro
    <select id="distroSelect"></select>
  </label>
  <button id="playBtn">▶ Animar</button>
  <button id="nextBtn" class="secondary">⏭ Siguiente (clear)</button>
</div>

<div class="term-wrap">
  <div class="term-bar">
    <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
    <span class="term-title">termux@android ~</span>
  </div>
  <div id="terminal"></div>
</div>

<p class="note">Simulación visual — en Termux real los colores se aplican con códigos ANSI y el layout de fastfetch es lado a lado con la info del sistema.</p>

];

let currentDistroIdx = 0;
const distroNames = Object.keys(distros);
let animating = false;

const terminal = document.getElementById('terminal');
const playBtn = document.getElementById('playBtn');
const nextBtn = document.getElementById('nextBtn');
const styleSelect = document.getElementById('styleSelect');
const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');
const distroSelect = document.getElementById('distroSelect');

distroNames.forEach((name, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = name.charAt(0).toUpperCase() + name.slice(1);
  distroSelect.appendChild(opt);
});

speedSlider.addEventListener('input', () => { speedLabel.textContent = speedSlider.value; });

function getDelay() {
  const speed = parseInt(speedSlider.value);
  return styleSelect.value === 'char'
    ? Math.max(1, 12 - speed)
    : Math.max(10, 120 - speed * 12);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function composeFull(distroName) {
  const d = distros[distroName];
  const logoLines = d.logo;
  const maxLogoW = Math.max(...logoLines.map(l => l.length));
  const totalLines = Math.max(logoLines.length, sysinfo.length);
  const composed = [];
  for (let i = 0; i < totalLines; i++) {
    const rawLogo = i < logoLines.length ? logoLines[i] : '';
    const padded = rawLogo + ' '.repeat(Math.max(0, maxLogoW - rawLogo.length));
    const info = i < sysinfo.length ? sysinfo[i] : '';
    composed.push({ logoHtml: `<span style="color:${d.color}">${escapeHtml(padded)}</span>`, infoHtml: info, rawLogo: padded, color: d.color });
  }
  return composed;
}

async function animateLine(distroName) {
  if (animating) return;
  animating = true;
  setButtons(true);
  const composed = composeFull(distroName);
  const delay = getDelay();
  terminal.innerHTML = '';
  for (const { logoHtml, infoHtml } of composed) {
    terminal.innerHTML += logoHtml + '    ' + infoHtml + '\n';
    terminal.scrollTop = terminal.scrollHeight;
    await sleep(delay);
  }
  await sleep(200);
  appendPrompt();
  animating = false;
  setButtons(false);
}

async function animateChar(distroName) {
  if (animating) return;
  animating = true;
  setButtons(true);
  const composed = composeFull(distroName);
  const delay = getDelay();
  terminal.innerHTML = '';
  for (let i = 0; i < composed.length; i++) {
    const { rawLogo, infoHtml, color } = composed[i];
    const lineId = `line-${i}`;
    terminal.innerHTML += `<span id="${lineId}"></span>\n`;
    const lineEl = document.getElementById(lineId);
    for (let j = 0; j < rawLogo.length; j++) {
      lineEl.innerHTML = `<span style="color:${color}">${escapeHtml(rawLogo.substring(0, j + 1))}</span>`;
      await sleep(delay);
    }
    lineEl.innerHTML = `<span style="color:${color}">${escapeHtml(rawLogo)}</span>    ${infoHtml}`;
    terminal.scrollTop = terminal.scrollHeight;
  }
  await sleep(200);
  appendPrompt();
  animating = false;
  setButtons(false);
}

function appendPrompt() {
  terminal.innerHTML += '\n<span style="color:#9ece6a;font-weight:bold">termux</span>:<span style="color:#7aa2f7;font-weight:bold">~</span>$ <span class="cursor-blink">█</span>';
}

function setButtons(disabled) {
  playBtn.disabled = disabled;
  nextBtn.disabled = disabled;
  playBtn.textContent = disabled ? '⏳ Animando...' : '▶ Animar';
}

async function runAnimation() {
  const idx = parseInt(distroSelect.value);
  currentDistroIdx = idx;
  (styleSelect.value === 'char' ? animateChar : animateLine)(distroNames[idx]);
}

async function nextDistro() {
  if (animating) return;
  animating = true;
  terminal.innerHTML += '\n<span style="color:#9ece6a;font-weight:bold">termux</span>:<span style="color:#7aa2f7;font-weight:bold">~</span>$ ';
  const span = document.createElement('span');
  span.style.color = '#c0caf5';
  terminal.appendChild(span);
  for (const ch of 'clear') { span.textContent += ch; await sleep(60); }
  await sleep(300);
  terminal.innerHTML = '';
  animating = false;
  currentDistroIdx = (currentDistroIdx + 1) % distroNames.length;
  distroSelect.value = currentDistroIdx;
  runAnimation();
}

playBtn.addEventListener('click', runAnimation);
nextBtn.addEventListener('click', nextDistro);
distroSelect.addEventListener('change', () => { if (!animating) runAnimation(); });

runAnimation();
</script>
